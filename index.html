<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas - Proyecto Gen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Pricedown&family=Teko:wght@600;700&family=Changa:wght@600;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container py-4">
        <!-- HEADER -->
        <header class="gta-header p-3 rounded mb-4 d-flex align-items-center gap-3">
            <div>
                <h1 class="gta-title mb-0">Planificador de Tareas</h1>
                <small class="text-uppercase gta-subtitle">Los Santos Edition</small>
            </div>
        </header>

        <div class="row g-4">
            <!-- FORMULARIO -->
            <div class="col-12 col-md-5 col-lg-4">
                <div class="card gta-card">
                    <div class="card-body p-4">
                        <h2
                            class="gta-card-title mb-3 border-bottom border-secondary pb-2 d-flex align-items-center gap-2">
                            <i class="bi bi-plus-square-fill text-warning"></i> Nueva misión
                        </h2>

                        <form id="taskForm">                
                            <div class="mb-3">
                                <label for="taskTitle" class="form-label gta-label fw-bold">Nombre de la Misión</label>
                                <input type="text" class="form-control gta-input" id="taskTitle" placeholder="...">
                            </div>

                          
                            <div class="mb-3">
                                <label for="taskDesc" class="form-label gta-label fw-bold">Detalles</label>
                                <textarea class="form-control gta-input" id="taskDesc" rows="3"
                                    placeholder="Añade instrucciones para la misión..."></textarea>
                            </div>

                          
                            <div class="mb-3">
                                <label for="taskPriority" class="form-label gta-label fw-bold">Nivel de Riesgo
                                    (Prioridad)</label>
                                <select class="form-select gta-input" id="taskPriority">
                                    <option value="" selected disabled>Selecciona la prioridad...</option>
                                    <option value="Baja">Baja</option>
                                    <option value="Media">Media</option>
                                    <option value="Alta">Alta</option>
                                </select>
                            </div>

                        
                            <div class="mb-3">
                                <label for="taskStatus" class="form-label gta-label fw-bold">Estado de la Misión</label>
                                <select class="form-select gta-input" id="taskStatus">
                                    <option value="" selected disabled>Selecciona el estado...</option>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="En Proceso">En Proceso</option>
                                    <option value="Completada">Completada</option>
                                </select>
                            </div>

                            
                            <div class="mb-4">
                                <label for="taskDueDate" class="form-label gta-label fw-bold">Fecha Límite</label>
                                <input type="date" class="form-control gta-input" id="taskDueDate">
                            </div>

                            <div id="alertError"
                                class="alert alert-danger d-none mb-3 fw-bold border-2 border-danger small p-2 text-center"
                                role="alert">
                                <i class="bi bi-exclamation-octagon-fill me-1"></i>
                                Diligencia todos los campos antes de continuar.
                            </div>

                            <button type="submit"
                                class="btn btn-gta-primary w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-star-fill"></i> Iniciar Misión
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TABLERO DE TAREAS -->
            <div class="col-12 col-md-7 col-lg-8">
                <div class="card gta-card">
                    <div class="card-body p-4">

                        <div
                            class="d-flex flex-wrap justify-content-between align-items-center mb-3 border-bottom border-secondary pb-3 gap-2">
                            <div>
                                <h2 class="gta-card-title mb-0">
                                    <i class="bi bi-journal-bookmark-fill me-2 text-warning"></i>Misiones
                                </h2>
                            </div>
                        </div>

                        <!-- Filtros de estado -->
                        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
                            <div class="btn-group btn-group-sm" role="group" id="filterGroup">
                                <button type="button" class="btn btn-gta-outline active"
                                    data-filter="todas">Todas</button>
                                <button type="button" class="btn btn-gta-outline"
                                    data-filter="pendientes">Pendientes</button>
                                <button type="button" class="btn btn-gta-outline" data-filter="pasadas">Pasadas</button>
                            </div>
                        </div>

                        <div class="row g-3" id="taskList">

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
