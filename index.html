<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas - Proyecto Gen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pricedown&family=Teko:wght@600;700&family=Changa:wght@600;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container py-4">
        <!-- HEADER -->
        <header class="app-header p-3 rounded mb-4 d-flex align-items-center gap-3">
            <div>
                <h1 class="app-title mb-0">Planificador de Tareas</h1>
                <small class="text-uppercase app-subtitle">Edición Especial</small>
            </div>
        </header>

        <div class="row g-4">
            <!-- FORMULARIO -->
            <div class="col-12 col-md-5 col-lg-4">
                <div class="card app-card">
                    <div class="card-body p-4">
                        <h2
                            class="app-card-title mb-3 border-bottom border-secondary pb-2 d-flex align-items-center gap-2">
                            <i class="bi bi-plus-square-fill text-warning"></i> Nueva misión
                        </h2>

                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="taskTitle" class="form-label app-label fw-bold">Nombre de la Misión</label>
                                <input type="text" class="form-control app-input" id="taskTitle" placeholder="...">
                            </div>

                            <div class="mb-3">
                                <label for="taskDesc" class="form-label app-label fw-bold">Detalles</label>
                                <textarea class="form-control app-input" id="taskDesc" rows="3"
                                    placeholder="Añade instrucciones para la misión..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="taskPriority" class="form-label app-label fw-bold">Nivel de Riesgo
                                    (Prioridad)</label>
                                <select class="form-select app-input" id="taskPriority">
                                    <option value="" selected disabled>Selecciona la prioridad...</option>
                                    <option value="Baja">Baja</option>
                                    <option value="Media">Media</option>
                                    <option value="Alta">Alta</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="taskStatus" class="form-label app-label fw-bold">Estado de la Misión</label>
                                <select class="form-select app-input" id="taskStatus">
                                    <option value="" selected disabled>Selecciona el estado...</option>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="En Proceso">En Proceso</option>
                                    <option value="Completada">Completada</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="taskDueDate" class="form-label app-label fw-bold">Fecha Límite</label>
                                <input type="date" class="form-control app-input" id="taskDueDate">
                            </div>

                            <div id="alertError"
                                class="alert alert-danger d-none mb-3 fw-bold border-2 border-danger small p-2 text-center"
                                role="alert">
                                <i class="bi bi-exclamation-octagon-fill me-1"></i>
                                Diligencia todos los campos antes de continuar.
                            </div>

                            <button type="submit"
                                class="btn btn-theme-primary w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-star-fill"></i> Iniciar Misión
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TABLERO DE TAREAS -->
            <div class="col-12 col-md-7 col-lg-8">
                <div class="card app-card">
                    <div class="card-body p-4">

                        <div
                            class="d-flex flex-wrap justify-content-between align-items-center mb-3 border-bottom border-secondary pb-3 gap-2">
                            <div>
                                <h2 class="app-card-title mb-0">
                                    <i class="bi bi-journal-bookmark-fill me-2 text-warning"></i>Misiones
                                </h2>
                            </div>
                        </div>

                        <!-- Filtros de estado -->
                        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
                            <div class="btn-group btn-group-sm" role="group" id="filterGroup">
                                <button type="button" class="btn btn-theme-outline active"
                                    data-filter="todas">Todas</button>
                                <button type="button" class="btn btn-theme-outline"
                                    data-filter="pendientes">Pendientes</button>
                                <button type="button" class="btn btn-theme-outline"
                                    data-filter="pasadas">Completadas</button>
                            </div>
                        </div>

                        <div class="row g-3" id="taskList">

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <template id="taskCardTemplate">
        <div class="col-12 col-lg-6">
            <div class="card h-100 app-task-card">
                <div class="card-body d-flex flex-column justify-content-between p-3">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge rounded-pill priority-badge"></span>
                            <span class="extra-small d-flex align-items-center gap-1 task-date-warning">
                                <i class="bi bi-calendar-event"></i>
                                <strong class="task-date"></strong>
                            </span>
                        </div>

                        <h3 class="h6 fw-bold mb-2 card-title task-title"></h3>
                        <p class="small mb-3 app-task-desc task-desc"></p>
                    </div>

                    <div class="pt-2 border-top border-secondary d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-2">
                            <div class="form-check m-0">
                                <input class="form-check-input chk-complete" type="checkbox"
                                    title="Marcar como completada">
                            </div>
                            <span class="badge bg-dark border border-secondary text-warning status-badge"></span>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-theme-edit p-0 btn-edit" title="Editar misión">
                                <i class="bi bi-pencil-square fs-6"></i>
                            </button>
                            <button class="btn btn-sm text-danger p-0 btn-delete" title="Eliminar misión">
                                <i class="bi bi-trash-fill fs-6"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="js/taskManager.js"></script>
    <script src="js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
